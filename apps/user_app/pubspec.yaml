name: omelo_user_app
description: "Omelo — find work that fits your life."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0
  # Already in the tree via supabase; used directly for optional error reports
  # (lib/core/observability.dart) instead of adding an SDK.
  http: ^1.2.0

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Device
  geolocator: ^13.0.2
  shared_preferences: ^2.3.3

  # Formatting
  intl: ^0.20.2
  # Shift times are shown in the work site's own time zone (IANA names from
  # the server), not the phone's.
  timezone: ^0.10.1

  # Tap a supervisor's number to call them.
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8
  livekit_client: ^2.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
